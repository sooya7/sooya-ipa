name: Repair Base 8 journal bootstrap

on:
  push:
    branches: ['fix/base8-journal-mode-bootstrap']

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[base8-journal-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/base8-journal-mode-bootstrap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Apply guarded repair
        run: python3 scripts/repair-base8-journal-bootstrap.py
      - name: Verify contracts
        run: |
          npm ci
          npm run test -w @sooya/web
          npm run typecheck
          npm run build
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ios/App/App/Plugins/SOOYADatabasePlugin.swift packages/web/src/local/nativeDatabaseContract.test.ts ios/App/App/Plugins/SOOYAReleaseConfig.swift ios/App/App/native-base.version
          git diff --cached --quiet && exit 0
          git commit -m 'fix(native): allow trusted journal-mode bootstrap [base8-journal-repair]'
          git push origin HEAD:fix/base8-journal-mode-bootstrap
