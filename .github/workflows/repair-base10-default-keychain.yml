name: Repair Base 10 default keychain

on:
  push:
    branches: ['fix/base10-default-keychain']

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[base10-keychain-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/base10-default-keychain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Apply guarded repair
        run: python3 scripts/repair-base10-default-keychain.py
      - name: Verify source contract
        run: |
          ! grep -q 'SOOYAKeychainAccessGroupResolver' ios/App/App/Plugins/SOOYASecretsPlugin.swift
          ! grep -q 'identity.accessGroup' ios/App/App/Plugins/SOOYASecretsPlugin.swift
          ! grep -q 'secretStoreResult' ios/App/App/Plugins/SOOYAHttpPlugin.swift
          ! grep -q 'storeResult' ios/App/App/Plugins/SOOYAMcpPlugin.swift
          grep -n 'nativeBaseVersion = 10' ios/App/App/Plugins/SOOYAReleaseConfig.swift
          test "$(cat ios/App/App/native-base.version)" = "10"
          npm ci
          npm run test -w @sooya/web
          npm run typecheck
          npm run build
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ios/App/App/Plugins/SOOYASecretsPlugin.swift ios/App/App/Plugins/SOOYAHttpPlugin.swift ios/App/App/Plugins/SOOYAMcpPlugin.swift ios/App/AppTests/SOOYASecretsPluginTests.swift ios/App/App/Plugins/SOOYAReleaseConfig.swift ios/App/App/native-base.version
          git diff --cached --quiet && exit 0
          git commit -m 'fix(native): use signing-safe default Keychain group [base10-keychain-repair]'
          git push origin HEAD:fix/base10-default-keychain
