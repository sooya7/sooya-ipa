name: Fix native model probe duplication
on:
  push:
    paths:
      - '.github/workflows/fix-native-model-probe-duplication.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collapse native model probe to selfie-only special case
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/web/src/local/NativeLocalCore.ts')
          text = path.read_text()

          text = text.replace("  CHAT_FALLBACK_SLOTS,\n  LocalCore,\n  MODEL_CAPABILITY_SLOTS,\n", "  LocalCore,\n")
          text = text.replace("  BuiltinChatProvider,\n  BuiltinEmbeddingProvider,\n  BuiltinImageProvider,\n  BuiltinRerankProvider,\n", "  BuiltinImageProvider,\n")
          text = text.replace("type NativeProviderConfig = ConstructorParameters<typeof BuiltinChatProvider>[1];", "type NativeProviderConfig = ConstructorParameters<typeof BuiltinImageProvider>[1];")
          text = text.replace("const PROBE_TEXT = '你好';\n", "")
          text = text.replace("const VISION_PROBE_PNG = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';\n", "")
          text = text.replace(
              " * Native IPA variant of LocalCore. The regular LocalCore admin bridge keeps\n * model tests side-effect free for generic/local consumers, while the real iOS\n * app deliberately exercises the saved provider through the native HTTP +\n * Keychain path so the Admin \"测试连接\" button answers whether the model works.\n",
              " * Native IPA variant of LocalCore. Standard model probes stay owned by\n * LocalCore so every environment uses one implementation. NativeLocalCore only\n * handles genuinely native-only admin behavior such as selfie probing.\n"
          )

          start = text.index("    const match = url.pathname.match(/^\\/api\\/admin\\/models\\/([^/]+)\\/test$/u);")
          end_marker = "    }) as T;\n"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = """    const match = url.pathname.match(/^\\/api\\/admin\\/models\\/([^/]+)\\/test$/u);\n    const rawCapability = match ? decodeURIComponent(match[1]!) : '';\n    if (!match || method !== 'POST' || rawCapability !== 'image') return await super.adminRequest<T>(path, options);\n\n    const body = isRecord(options.body) ? options.body : {};\n    if (body.mode !== 'selfie') return await super.adminRequest<T>(path, options);\n\n    const configured = await this.configRepo.getProvider('image');\n    if (!configured) throw new Error('这个能力还没配全（接口协议、地址、模型名、密钥缺一不可）');\n    return await probeNativeSelfieImage(this.probeHttp, configured, {\n      referenceImages: this.probeReferenceImages\n    }) as T;\n"""
          text = text[:start] + replacement + text[end:]

          start = text.index("/** Execute one minimal real provider request using the saved native config. */")
          end = text.index("function modelProbeError", start)
          replacement = """/** Native-only selfie probe. Standard model tests are owned by LocalCore. */\nexport async function probeNativeSelfieImage(\n  http: HttpPlatform,\n  configured: NativeProviderConfig,\n  options: { referenceImages?: NativeProbeReferenceLoader } = {}\n): Promise<NativeModelTestResult> {\n  if (!configured.enabled || !configured.baseUrl || !configured.model || !configured.secretRef) {\n    throw new Error('这个能力还没配全（接口协议、地址、模型名、密钥缺一不可）');\n  }\n\n  const probeTimeoutMs = nativeModelProbeTimeoutMs(configured, 'image');\n  const controller = new AbortController();\n  const timer = setTimeout(\n    () => controller.abort(new Error(`连接测试超过 ${nativeModelProbeTimeoutLabel(probeTimeoutMs)}还没有结果`)),\n    probeTimeoutMs\n  );\n  const startedAt = Date.now();\n  try {\n    const provider = new BuiltinImageProvider(http, configured);\n    const prompt = '生成一张 SOOYA 的正面自然生活自拍（连接测试）';\n    const references = await options.referenceImages?.(prompt) ?? [];\n    const framing = references[0]?.framing;\n    const image = await provider.generate(prompt, {\n      signal: controller.signal,\n      ...(references.length ? { referenceImages: references } : {})\n    });\n    return {\n      ok: true,\n      slot: 'image',\n      provider: provider.name,\n      model: configured.model || undefined,\n      latencyMs: Date.now() - startedAt,\n      detail: `自拍链路正常：参考图 ${framing ?? '无'}，已收到 ${Math.max(1, Math.round(image.data.byteLength / 1024))} KB ${image.mime} 图片`,\n      mode: 'selfie',\n      ...(framing ? { framing } : {})\n    };\n  } catch (error) {\n    const pipelineStage = error instanceof ImagePipelineError ? error.stage : 'generation';\n    const status = error instanceof ProviderRequestError ? error.status : error instanceof ImagePipelineError ? error.status : undefined;\n    throw new Error(`图片自拍链路失败 · 阶段：${imageStageLabel(pipelineStage)}${status ? ` · HTTP ${status}` : ''} · ${modelProbeError(error, Date.now() - startedAt, controller.signal.aborted)}`);\n  } finally {\n    clearTimeout(timer);\n  }\n}\n\n"""
          text = text[:start] + replacement + text[end:]

          helper_start = text.index("function hasDirectorProbe")
          helper_end = text.index("function bytesToBase64", helper_start)
          text = text[:helper_start] + text[helper_end:]

          forbidden = [
              "maxTokens: 16",
              "可能被最大输出 token 截断",
              "probeNativeModel(",
              "BuiltinChatProvider",
              "BuiltinEmbeddingProvider",
              "BuiltinRerankProvider",
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f'forbidden legacy probe fragment remains: {needle}')
          if "probeNativeSelfieImage" not in text:
              raise SystemExit('native selfie probe replacement missing')
          if "return await super.adminRequest<T>(path, options);" not in text:
              raise SystemExit('standard model probe delegation missing')

          path.write_text(text)
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/web/src/local/NativeLocalCore.ts
          git commit -m 'refactor(admin): use one model probe owner'
          git push origin HEAD:main
      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-native-model-probe-duplication.yml
          git commit -m 'chore: remove one-shot model probe workflow'
          git push origin HEAD:main
