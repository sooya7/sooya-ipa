name: One-shot image job recovery fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-image-job-recovery-gap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make missing remote jobs resumable
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('packages/core/src/providers/durable-image-provider.ts')
          s = p.read_text()
          old_sig = "resumeJob(input: { jobId?: string; clientRequestId?: string }, lifecycle?: ImageJobLifecycle, signal?: AbortSignal): Promise<GeneratedImage>;"
          new_sig = "resumeJob(input: { jobId?: string; clientRequestId?: string; recoverPrompt?: string; referenceImages?: ImageJobReference[] }, lifecycle?: ImageJobLifecycle, signal?: AbortSignal): Promise<GeneratedImage>;"
          assert s.count(old_sig) == 1, s.count(old_sig)
          s = s.replace(old_sig, new_sig, 1)
          old_impl = "    input: { jobId?: string; clientRequestId?: string },\n    lifecycle?: ImageJobLifecycle,\n    signal?: AbortSignal\n  ): Promise<GeneratedImage> {"
          new_impl = "    input: { jobId?: string; clientRequestId?: string; recoverPrompt?: string; referenceImages?: ImageJobReference[] },\n    lifecycle?: ImageJobLifecycle,\n    signal?: AbortSignal\n  ): Promise<GeneratedImage> {"
          assert s.count(old_impl) == 1, s.count(old_impl)
          s = s.replace(old_impl, new_impl, 1)
          old_missing = "    if (!jobId) throw new ProviderRequestError('image job could not be recovered');"
          new_missing = """    const recoverPrompt = cleanString(input.recoverPrompt);
    if (!jobId && recoverPrompt && clientRequestId) {
      const recoveryLifecycle: ImageJobLifecycle = lifecycle ?? { clientRequestId };
      const started = await this.startJob(recoverPrompt, {
        signal,
        ...(input.referenceImages?.length ? { referenceImages: input.referenceImages } : {})
      }, recoveryLifecycle);
      jobId = started.jobId;
    }
    if (!jobId) throw new ProviderRequestError('image job could not be recovered');"""
          assert s.count(old_missing) == 1, s.count(old_missing)
          s = s.replace(old_missing, new_missing, 1)
          p.write_text(s)

          p = Path('packages/core/src/app/reply-image-job-install.ts')
          s = p.read_text()
          old_prepare = """        const prepared = await prepareImageJob(this, runtime, imagePrompt, selfImage, context, signal);
        const lifecycle = {"""
          new_prepare = """        const prepared = await prepareImageJob(this, runtime, imagePrompt, selfImage, context, signal);
        // Persist everything needed to recreate the same idempotent submission
        // before POST /image-jobs. If iOS suspends us between the POST and its
        // response, app recovery can safely submit the same clientRequestId.
        pendingMeta = {
          ...pendingMeta,
          imageState: 'creating',
          preparedPrompt: prepared.prompt,
          ...(prepared.aspectRatio ? { aspectRatio: prepared.aspectRatio } : {}),
          ...(prepared.referenceMediaId ? { referenceMediaId: prepared.referenceMediaId, editedUserImage: true } : {})
        };
        await this.options.messages.updatePart(pendingPartId, { status: 'pending', meta: pendingMeta });
        await emitMessageUpdated(this.options, messageId);
        const lifecycle = {"""
          assert s.count(old_prepare) == 1, s.count(old_prepare)
          s = s.replace(old_prepare, new_prepare, 1)

          old_initial_finish = """          prompt: imagePrompt,
          selfImage,
          clientRequestId,
          jobId: started.jobId,
          initialMeta: pendingMeta,
          signal: undefined"""
          new_initial_finish = """          prompt: imagePrompt,
          selfImage,
          clientRequestId,
          jobId: started.jobId,
          recoverPrompt: prepared.prompt,
          recoveryReferences: prepared.references,
          initialMeta: pendingMeta,
          signal: undefined"""
          assert s.count(old_initial_finish) == 1, s.count(old_initial_finish)
          s = s.replace(old_initial_finish, new_initial_finish, 1)

          old_recover = """        activeRecoveredParts.add(part.id);
        void finishDetachedJob({
          options: this.options,
          runtime,
          provider,
          messageId: message.id,
          partId: part.id,
          prompt: cleanString(part.meta.prompt) ?? '',
          selfImage: part.meta.selfImage === true,
          clientRequestId: clientRequestId ?? imageRequestId(),
          jobId: remoteJobId,
          initialMeta: part.meta,
          signal: undefined
        }).finally(() => activeRecoveredParts.delete(part.id));"""
          new_recover = """        const recoverPrompt = cleanString(part.meta.preparedPrompt) ?? cleanString(part.meta.prompt) ?? '';
        const recoveryReferences = await recoverImageReferences(runtime, part.meta, recoverPrompt).catch(() => []);
        activeRecoveredParts.add(part.id);
        void finishDetachedJob({
          options: this.options,
          runtime,
          provider,
          messageId: message.id,
          partId: part.id,
          prompt: cleanString(part.meta.prompt) ?? recoverPrompt,
          selfImage: part.meta.selfImage === true,
          clientRequestId: clientRequestId ?? imageRequestId(),
          jobId: remoteJobId,
          recoverPrompt,
          recoveryReferences,
          initialMeta: part.meta,
          signal: undefined
        }).finally(() => activeRecoveredParts.delete(part.id));"""
          assert s.count(old_recover) == 1, s.count(old_recover)
          s = s.replace(old_recover, new_recover, 1)

          marker = """async function finishDetachedJob(input: {
"""
          helper = """async function recoverImageReferences(
  runtime: ReplyFeatureRuntime,
  meta: Record<string, unknown>,
  prompt: string
): Promise<Array<{ data: Uint8Array; mime: string }>> {
  const referenceMediaId = cleanString(meta.referenceMediaId);
  if (referenceMediaId) {
    const read = await runtime.media.read(referenceMediaId);
    if (read) return [{ data: read.data instanceof Uint8Array ? read.data : new Uint8Array(read.data), mime: read.record.mime }];
  }
  if (meta.selfImage === true) return await runtime.referenceImages?.(prompt) ?? [];
  return [];
}

async function finishDetachedJob(input: {
"""
          assert s.count(marker) == 1, s.count(marker)
          s = s.replace(marker, helper, 1)

          old_finish_type = """  clientRequestId: string;
  jobId?: string;
  initialMeta: Record<string, unknown>;
  signal?: AbortSignal;
}): Promise<void> {"""
          new_finish_type = """  clientRequestId: string;
  jobId?: string;
  recoverPrompt?: string;
  recoveryReferences?: Array<{ data: Uint8Array; mime: string }>;
  initialMeta: Record<string, unknown>;
  signal?: AbortSignal;
}): Promise<void> {"""
          assert s.count(old_finish_type) == 1, s.count(old_finish_type)
          s = s.replace(old_finish_type, new_finish_type, 1)

          old_resume = """    const generated = await input.provider.resumeJob({ jobId: input.jobId, clientRequestId: input.clientRequestId }, {"""
          new_resume = """    const generated = await input.provider.resumeJob({
      jobId: input.jobId,
      clientRequestId: input.clientRequestId,
      recoverPrompt: input.recoverPrompt,
      referenceImages: input.recoveryReferences
    }, {"""
          assert s.count(old_resume) == 1, s.count(old_resume)
          s = s.replace(old_resume, new_resume, 1)
          p.write_text(s)
          PY

          cat > packages/core/src/providers/durable-image-provider.test.ts <<'TEST'
          import { describe, expect, it, vi } from 'vitest';
          import type { ProviderConfig } from '../db/config.repo.js';
          import type { HttpPlatform } from '../platform/http.js';
          import type { ImageProvider } from './types.js';
          import { DurableAnumaImageProvider } from './durable-image-provider.js';

          const json = (status: number, value: unknown) => ({
            status,
            headers: { 'content-type': 'application/json' },
            body: new TextEncoder().encode(JSON.stringify(value))
          });

          describe('DurableAnumaImageProvider recovery', () => {
            it('idempotently re-submits the same client request when lookup has no job yet', async () => {
              const calls: string[] = [];
              const http = {
                async request(request: { url: string; method?: string }) {
                  calls.push(`${request.method ?? 'GET'} ${request.url}`);
                  if (request.url.endsWith('/image-jobs/by-client/client-1')) return json(404, { error: 'not found' });
                  if (request.url.endsWith('/image-jobs') && request.method === 'POST') return json(200, { jobId: 'job-1', status: 'queued' });
                  if (request.url.endsWith('/image-jobs/job-1')) return json(200, { status: 'succeeded', result: { url: 'https://cdn.example/result.png', mime: 'image/png' } });
                  if (request.url === 'https://cdn.example/result.png') return { status: 200, headers: { 'content-type': 'image/png' }, body: new Uint8Array([1, 2, 3]) };
                  throw new Error(`unexpected request ${request.url}`);
                }
              } as unknown as HttpPlatform;
              const config = {
                provider: 'anuma-input-images', enabled: true, baseUrl: 'https://api.example/v1', model: 'image-model', secretRef: 'image-secret', options: {}
              } as ProviderConfig;
              const legacy = {
                name: 'anuma-input-images', configured: true,
                generate: vi.fn(), edit: vi.fn(), inspectHealth: vi.fn()
              } as unknown as ImageProvider;
              const provider = new DurableAnumaImageProvider(http, config, legacy);

              const image = await provider.resumeJob({
                clientRequestId: 'client-1',
                recoverPrompt: 'send a photo'
              }, { clientRequestId: 'client-1' });

              expect([...image.data]).toEqual([1, 2, 3]);
              expect(calls).toEqual([
                'GET https://api.example/v1/image-jobs/by-client/client-1',
                'POST https://api.example/v1/image-jobs',
                'GET https://api.example/v1/image-jobs/job-1',
                'GET https://cdn.example/result.png'
              ]);
            });
          });
          TEST

          git rm .github/workflows/fix-image-job-recovery-gap.yml
          git diff --check
      - name: Verify focused recovery test and typecheck
        run: |
          npm run test -w @sooya/core -- durable-image-provider.test.ts
          npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          git config user.name sooya7
          git config user.email 779083953@qq.com
          git add packages/core/src/providers/durable-image-provider.ts packages/core/src/app/reply-image-job-install.ts packages/core/src/providers/durable-image-provider.test.ts .github/workflows/fix-image-job-recovery-gap.yml
          git commit -m "fix(image): recover jobs missing a remote id"
          git push origin HEAD:main
