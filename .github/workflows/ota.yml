name: OTA web bundle

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/web/**'
      - 'packages/migration-tools/**'
      - 'scripts/build-ota.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:ota-migrations -- origin/main...HEAD
      - run: npm run build
      - name: Build integrity-gated OTA package
        env:
          RELEASE_ID: ota-${{ github.sha }}
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
          OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
        run: |
          ota_args=(
            --bundle packages/web/dist
            --out build/ota
            --release-id "$RELEASE_ID"
            --native-min 3 --native-max 3
            --schema-min 46 --schema-max 46
            --bridge-capability database.sqlite
            --bridge-capability keychain.secrets
            --bridge-capability http.native
            --bridge-capability http.stream
            --bridge-capability http.websocket
            --bridge-capability mcp.native
            --bridge-capability mcp.transport
            --bridge-capability media.sandbox
            --bridge-capability archive.zip
            --bridge-capability oauth.system
            --bridge-capability notifications.local
            --bridge-capability notifications.push-client
            --bridge-capability ota.updater
            --bridge-capability ota.signature.ed25519
          )
          test -n "${OTA_PRIVATE_KEY:-}" || { echo 'OTA_PRIVATE_KEY is required'; exit 1; }
          if [ -n "${OTA_PUBLISH_URL:-}" ]; then
            ota_args+=(--bundle-url "${OTA_PUBLISH_URL%/}/bundles/${RELEASE_ID}/bundle.zip")
          else
            ota_args+=(--bundle-url bundle.zip)
          fi
          node scripts/build-ota.mjs "${ota_args[@]}"
          (cd build/ota && zip -qry ../bundle.zip bundle)
          node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFile, writeFile } from 'node:fs/promises'; const file = await readFile('build/bundle.zip'); const manifestPath = 'build/ota/ota-manifest.json'; const manifest = JSON.parse(await readFile(manifestPath, 'utf8')); manifest.bundle.zipSha256 = createHash('sha256').update(file).digest('hex'); await writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: sooya-ota-${{ github.sha }}
          path: |
            build/ota/ota-manifest.json
            build/bundle.zip
          if-no-files-found: error

  publish-ota:
    if: github.ref == 'refs/heads/main'
    needs: build-ota
    runs-on: ubuntu-latest
    env:
      OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
      OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
      RELEASE_ID: ota-${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sooya-ota-${{ github.sha }}
          path: build
      - name: Publish immutable OTA and stable pointer
        run: |
          set -euo pipefail
          test -n "${OTA_PRIVATE_KEY:-}" || { echo 'OTA_PRIVATE_KEY is required'; exit 1; }
          test -n "${OTA_PUBLISH_URL:-}" || { echo 'OTA_PUBLISH_URL is required'; exit 1; }
          test -n "${OTA_PUBLISH_TOKEN:-}" || { echo 'OTA_PUBLISH_TOKEN is required'; exit 1; }
          base="${OTA_PUBLISH_URL%/}"
          auth=(-H "Authorization: Bearer ${OTA_PUBLISH_TOKEN}")
          curl --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/bundle.zip "${base}/bundles/${RELEASE_ID}/bundle.zip"
          curl --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/manifests/${RELEASE_ID}/ota-manifest.json"
          curl --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/stable.json.tmp"
          curl --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/stable.json"
