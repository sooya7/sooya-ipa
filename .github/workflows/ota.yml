name: OTA web bundle

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/web/**'
      - 'packages/migration-tools/**'
      - 'scripts/build-ota.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:ota-migrations -- origin/main...HEAD
      - run: npm run build
      - name: Build integrity-gated OTA package
        env:
          RELEASE_ID: ota-${{ github.sha }}
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
          OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
        run: |
          ota_args=(
            --bundle packages/web/dist
            --out build/ota
            --release-id "$RELEASE_ID"
            --native-min 10 --native-max 10
            --schema-min 46 --schema-max 46
            --bridge-capability database.sqlite
            --bridge-capability keychain.secrets
            --bridge-capability http.native
            --bridge-capability http.stream
            --bridge-capability http.websocket
            --bridge-capability mcp.native
            --bridge-capability mcp.transport
            --bridge-capability media.sandbox
            --bridge-capability archive.zip
            --bridge-capability oauth.system
            --bridge-capability notifications.local
            --bridge-capability notifications.push-client
            --bridge-capability ota.updater
            --bridge-capability ota.signature.ed25519
          )
          test -n "${OTA_PRIVATE_KEY:-}" || { echo 'OTA_PRIVATE_KEY is required'; exit 1; }
          if [ -n "${OTA_PUBLISH_URL:-}" ]; then
            ota_args+=(--bundle-url "${OTA_PUBLISH_URL%/}/bundles/${RELEASE_ID}/bundle.zip")
          else
            ota_args+=(--bundle-url bundle.zip)
          fi
          node scripts/build-ota.mjs "${ota_args[@]}"
          (cd build/ota && zip -qry ../bundle.zip bundle)
          node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFile, writeFile } from 'node:fs/promises'; const file = await readFile('build/bundle.zip'); const manifestPath = 'build/ota/ota-manifest.json'; const manifest = JSON.parse(await readFile(manifestPath, 'utf8')); manifest.bundle.zipSha256 = createHash('sha256').update(file).digest('hex'); await writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: sooya-ota-${{ github.sha }}
          path: |
            build/ota/ota-manifest.json
            build/bundle.zip
          if-no-files-found: error

  publish-ota:
    if: github.ref == 'refs/heads/main'
    needs: build-ota
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
      OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
      RELEASE_ID: ota-${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sooya-ota-${{ github.sha }}
          path: build
      - name: Publish immutable OTA and stable pointer
        run: |
          set -euo pipefail
          test -n "${OTA_PRIVATE_KEY:-}" || { echo 'OTA_PRIVATE_KEY is required'; exit 1; }
          test -n "${OTA_PUBLISH_URL:-}" || { echo 'OTA_PUBLISH_URL is required'; exit 1; }
          test -n "${OTA_PUBLISH_TOKEN:-}" || { echo 'OTA_PUBLISH_TOKEN is required'; exit 1; }
          base="${OTA_PUBLISH_URL%/}"
          auth=(-H "Authorization: Bearer ${OTA_PUBLISH_TOKEN}")
          upload_tag="ota-upload-${GITHUB_SHA}"
          gh release delete "${upload_tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes >/dev/null 2>&1 || true
          trap 'gh release delete "${upload_tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes >/dev/null 2>&1 || true' EXIT
          gh release create "${upload_tag}" build/bundle.zip --repo "${GITHUB_REPOSITORY}" --title "Temporary OTA upload ${GITHUB_SHA}" --notes "Temporary transport asset; removed after verified server pull." --prerelease --latest=false
          bytes="$(stat -c %s build/bundle.zip)"
          sha256="$(sha256sum build/bundle.zip | cut -d ' ' -f 1)"
          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${upload_tag}" --jq '.assets[] | select(.name == "bundle.zip") | .id')"
          test -n "${asset_id}" || { echo 'temporary release asset is missing'; exit 1; }
          asset_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          PULL_ASSET_URL="${asset_url}" PULL_BYTES="${bytes}" PULL_SHA256="${sha256}" node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('pull.json', JSON.stringify({ url: process.env.PULL_ASSET_URL, githubToken: process.env.GH_TOKEN, bytes: Number(process.env.PULL_BYTES), sha256: process.env.PULL_SHA256 }));"

          # Queue the server-side download and return immediately. The old synchronous
          # endpoint could sit behind Cloudflare for >120s and surface as HTTP 524.
          curl --http1.1 --fail --show-error --silent --max-time 30 \
            -H 'Content-Type: application/json' "${auth[@]}" \
            --data-binary @pull.json "${base}/uploads/${RELEASE_ID}/pull" > pull-response.json
          cat pull-response.json

          state=""
          for attempt in $(seq 1 240); do
            if status_json="$(curl --http1.1 --fail --show-error --silent --max-time 30 "${auth[@]}" "${base}/uploads/${RELEASE_ID}/status")"; then
              state="$(STATUS_JSON="${status_json}" python3 -c 'import json, os; print(json.loads(os.environ["STATUS_JSON"]).get("state", ""))')"
              case "${state}" in
                ready)
                  echo "OTA bundle pull completed"
                  break
                  ;;
                failed)
                  echo "OTA bundle pull failed: ${status_json}" >&2
                  exit 1
                  ;;
                queued|running)
                  echo "OTA bundle pull ${state} (${attempt}/240)"
                  ;;
                *)
                  echo "Unexpected OTA pull state: ${status_json}" >&2
                  ;;
              esac
            else
              echo "OTA pull status not available yet (${attempt}/240)"
            fi
            sleep 5
          done
          test "${state}" = "ready" || { echo 'OTA bundle pull timed out after 20 minutes' >&2; exit 1; }

          # The worker verifies byte count and SHA-256 before atomically publishing.
          curl --http1.1 --fail --show-error --silent --head "${base}/bundles/${RELEASE_ID}/bundle.zip" >/dev/null
          curl --http1.1 --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/manifests/${RELEASE_ID}/ota-manifest.json"
          curl --http1.1 --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/stable.json.tmp"
          curl --http1.1 --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/stable.json"
