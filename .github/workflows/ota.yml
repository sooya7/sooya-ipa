name: OTA web bundle

# Web-only admin/UI fixes are shipped by this OTA bundle and do not require a native reinstall.

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/web/**'
      - 'packages/migration-tools/**'
      - 'scripts/build-ota.mjs'
      - 'scripts/ota-gates.mjs'
      - 'scripts/ota_server.py'
      - 'scripts/test_ota_server.py'
      - '.github/workflows/ota.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:ota-migrations -- origin/main...HEAD
      - run: npm run build
      - name: Build integrity-gated OTA package
        env:
          RELEASE_ID: ota-${{ github.sha }}
          BUNDLE_TAG: ota-bundle-${{ github.sha }}
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${OTA_PRIVATE_KEY:-}" || { echo 'OTA_PRIVATE_KEY is required'; exit 1; }
          bundle_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${BUNDLE_TAG}/bundle.zip"
          # Compatibility gates come from the source of truth (Swift
          # SOOYAReleaseConfig + core migrations) so a native/schema/capability
          # change cannot silently desync the OTA gate.
          node scripts/ota-gates.mjs --env > build-gates.env
          # shellcheck disable=SC1091
          source build-gates.env
          read -r -a capability_args <<< "$OTA_CAPABILITIES"
          node scripts/build-ota.mjs \
            --bundle packages/web/dist \
            --out build/ota \
            --release-id "$RELEASE_ID" \
            --bundle-url "$bundle_url" \
            --native-min "$NATIVE_MIN" --native-max "$NATIVE_MAX" \
            --schema-min "$SCHEMA_MIN" --schema-max "$SCHEMA_MAX" \
            $(printf -- '--bridge-capability %s ' "${capability_args[@]}")
          (cd build/ota && zip -qry ../bundle.zip bundle)
          node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFile, writeFile } from 'node:fs/promises'; const file = await readFile('build/bundle.zip'); const manifestPath = 'build/ota/ota-manifest.json'; const manifest = JSON.parse(await readFile(manifestPath, 'utf8')); manifest.bundle.zipSha256 = createHash('sha256').update(file).digest('hex'); await writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n');"
          node --input-type=module -e "import { verifyOtaPackage } from './packages/migration-tools/src/ota.mjs'; await verifyOtaPackage('build/ota', { requireSignature: true });"
      - uses: actions/upload-artifact@v4
        with:
          name: sooya-ota-${{ github.sha }}
          path: |
            build/ota/ota-manifest.json
            build/bundle.zip
          if-no-files-found: error

  publish-ota:
    if: github.ref == 'refs/heads/main'
    needs: build-ota
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
      OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
      RELEASE_ID: ota-${{ github.sha }}
      BUNDLE_TAG: ota-bundle-${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sooya-ota-${{ github.sha }}
          path: build
      - name: Publish immutable OTA and stable pointer
        run: |
          set -euo pipefail
          test -n "${OTA_PRIVATE_KEY:-}" || { echo 'OTA_PRIVATE_KEY is required'; exit 1; }
          test -n "${OTA_PUBLISH_URL:-}" || { echo 'OTA_PUBLISH_URL is required'; exit 1; }
          test -n "${OTA_PUBLISH_TOKEN:-}" || { echo 'OTA_PUBLISH_TOKEN is required'; exit 1; }

          base="${OTA_PUBLISH_URL%/}"
          auth=(-H "Authorization: Bearer ${OTA_PUBLISH_TOKEN}")
          bytes="$(stat -c %s build/bundle.zip)"
          sha256="$(sha256sum build/bundle.zip | cut -d ' ' -f 1)"
          expected_digest="sha256:${sha256}"
          bundle_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${BUNDLE_TAG}/bundle.zip"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${BUNDLE_TAG}" > release.json 2>/dev/null; then
            asset_id="$(jq -r '.assets[]? | select(.name == "bundle.zip") | .id' release.json | head -n1)"
            if [ -z "${asset_id}" ]; then
              gh release upload "${BUNDLE_TAG}" build/bundle.zip --repo "${GITHUB_REPOSITORY}"
            fi
          else
            gh release create "${BUNDLE_TAG}" build/bundle.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --title "SOOYA OTA bundle ${GITHUB_SHA}" \
              --notes "Immutable web OTA bundle for ${GITHUB_SHA}. The signed manifest is published separately by the OTA control plane." \
              --prerelease --latest=false
          fi

          verified=""
          for attempt in $(seq 1 20); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${BUNDLE_TAG}" > release.json
            asset_size="$(jq -r '.assets[]? | select(.name == "bundle.zip") | .size // empty' release.json | head -n1)"
            asset_digest="$(jq -r '.assets[]? | select(.name == "bundle.zip") | .digest // empty' release.json | head -n1)"
            asset_state="$(jq -r '.assets[]? | select(.name == "bundle.zip") | .state // empty' release.json | head -n1)"
            if [ "${asset_state}" = "uploaded" ] && [ "${asset_size}" = "${bytes}" ] && [ "${asset_digest}" = "${expected_digest}" ]; then
              verified=1
              break
            fi
            if [ -n "${asset_digest}" ] && { [ "${asset_size}" != "${bytes}" ] || [ "${asset_digest}" != "${expected_digest}" ]; }; then
              echo "Existing OTA release asset does not match the built bundle" >&2
              exit 1
            fi
            sleep 2
          done
          test -n "${verified}" || { echo 'OTA release asset was not verifiable' >&2; exit 1; }

          # Capgo accepts arbitrary HTTPS bundle URLs, including GitHub release assets.
          # The signed manifest pins this URL, while checksum pins the exact zip bytes.
          curl --fail --show-error --silent --location --head "${bundle_url}" >/dev/null
          manifest_bundle_url="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const m=JSON.parse(await readFile('build/ota/ota-manifest.json','utf8')); process.stdout.write(m.bundleUrl ?? '');")"
          manifest_zip_sha="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const m=JSON.parse(await readFile('build/ota/ota-manifest.json','utf8')); process.stdout.write(m.bundle?.zipSha256 ?? '');")"
          test "${manifest_bundle_url}" = "${bundle_url}" || { echo 'OTA manifest bundle URL mismatch' >&2; exit 1; }
          test "${manifest_zip_sha}" = "${sha256}" || { echo 'OTA manifest zip checksum mismatch' >&2; exit 1; }

          # Only small signed control-plane files pass through sooya.icu.
          curl --http1.1 --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/manifests/${RELEASE_ID}/ota-manifest.json"
          curl --http1.1 --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/stable.json.tmp"
          curl --http1.1 --fail --retry 3 --retry-all-errors "${auth[@]}" -T build/ota/ota-manifest.json "${base}/stable.json"
