          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/app/local-core.ts packages/core/src/app/native-presence-contract.test.ts packages/web/src/local/nativeBoot.ts packages/web/src/local/nativePresenceBootstrap.ts packages/web/src/local/nativePresenceBootstrap.test.ts
