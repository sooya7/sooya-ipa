name: Fix native header presence 20260815

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-native-presence-20260815.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    env:
      OLD_ACTIVE: 
      NEW_ACTIVE: 
      OLD_REFRESH: 
      NEW_REFRESH: 
      OLD_FORECAST: 
      NEW_FORECAST: 
      HELPER: 
      HELPER_TEST: 
      CONTRACT_TEST: 
      BOOT_IMPORT_OLD: aW1wb3J0IHsgQlVJTFRJTl9TVElDS0VSUywgQnVpbHRpblN0aWNrZXJNZWRpYSwgYWZ0ZXJBcHBSZWFkeSB9IGZyb20gJy4vYnVpbHRpblN0aWNrZXJzLmpzJzsK
      BOOT_IMPORT_NEW: aW1wb3J0IHsgQlVJTFRJTl9TVElDS0VSUywgQnVpbHRpblN0aWNrZXJNZWRpYSwgYWZ0ZXJBcHBSZWFkeSB9IGZyb20gJy4vYnVpbHRpblN0aWNrZXJzLmpzJzsKaW1wb3J0IHsgZW5zdXJlTmF0aXZlQ29tcGFuaW9uU3RhdGUgfSBmcm9tICcuL25hdGl2ZVByZXNlbmNlQm9vdHN0cmFwLmpzJzsK
      BOOT_CREATE_OLD: ICBjb25zdCBjb3JlID0gbmV3IExvY2FsQ29yZSh7IGRiLCBzZWNyZXRzLCBtZWRpYVN0b3JlLCBodHRwLCBtY3A6IG5ldyBDYXBhY2l0b3JNY3AoKSwgdG9vbFJlZ2lzdHJ5OiByZWdpc3RyeSwgdG9vbFBvbGljeTogcG9saWN5LCB0b29sUnVudGltZTogcnVudGltZSB9KTsKICBhd2FpdCBzZWVkU2VydmVyUGVyc29uYU9uY2UoY29yZS5zZXR0aW5nc1JlcG8pOwo=
      BOOT_CREATE_NEW: 
      BOOT_LIFE_OLD: ICB2b2lkIHdpcmVOYXRpdmVMaWZlY3ljbGUoY29yZSkuY2F0Y2goKGVycm9yKSA9PiBjb25zb2xlLndhcm4oJ05hdGl2ZSBsaWZlY3ljbGUgd2lyaW5nIGlzIHVuYXZhaWxhYmxlJywgZXJyb3IpKTsK
      BOOT_LIFE_NEW: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Apply native presence fixes
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          def text(name):
              return base64.b64decode(os.environ[name]).decode()
          def replace_once(path, old_name, new_name):
              p = Path(path)
              source = p.read_text()
              old = text(old_name)
              if old not in source:
                  raise SystemExit(f'{path} target {old_name} not found')
              p.write_text(source.replace(old, text(new_name), 1))
          replace_once('packages/core/src/app/local-core.ts', 'OLD_ACTIVE', 'NEW_ACTIVE')
          replace_once('packages/core/src/app/local-core.ts', 'OLD_REFRESH', 'NEW_REFRESH')
          replace_once('packages/core/src/app/local-core.ts', 'OLD_FORECAST', 'NEW_FORECAST')
          replace_once('packages/web/src/local/nativeBoot.ts', 'BOOT_IMPORT_OLD', 'BOOT_IMPORT_NEW')
          replace_once('packages/web/src/local/nativeBoot.ts', 'BOOT_CREATE_OLD', 'BOOT_CREATE_NEW')
          replace_once('packages/web/src/local/nativeBoot.ts', 'BOOT_LIFE_OLD', 'BOOT_LIFE_NEW')
          Path('packages/web/src/local/nativePresenceBootstrap.ts').write_text(text('HELPER'))
          Path('packages/web/src/local/nativePresenceBootstrap.test.ts').write_text(text('HELPER_TEST'))
          Path('packages/core/src/app/native-presence-contract.test.ts').write_text(text('CONTRACT_TEST'))
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -w @sooya/core
      - run: npm run test -w @sooya/web
      - run: npm run build
      - name: Commit verified fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/app/local-core.ts packages/core/src/app/native-presence-contract.test.ts packages/web/src/local/nativeBoot.ts packages/web/src/local/nativePresenceBootstrap.ts packages/web/src/local/nativePresenceBootstrap.test.ts
          git rm .github/workflows/fix-native-presence-20260815.yml
          git commit -m 'fix(native): initialize header life and weather presence'
          git push origin HEAD:main
