name: One-shot chat context continuity fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-chat-context-continuity.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch context continuity
        shell: bash
        run: |
          echo ''.repeat(500)}"""
assert t.count(needle) == 1, t.count(needle)
t = t.replace(needle, insert + needle, 1)
test.write_text(t)

workflow = Path(".github/workflows/fix-chat-context-continuity.yml")
if workflow.exists():
    workflow.unlink()
' | base64 -d > /tmp/fix-chat-context.py
          python /tmp/fix-chat-context.py
          git diff --check
      - name: Verify context tests and typecheck
        run: |
          npm run test -w @sooya/core -- context-builder.test.ts
          npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          git config user.name sooya7
          git config user.email 779083953@qq.com
          git add packages/core/src/app/context-builder.ts packages/core/src/app/context-builder.test.ts .github/workflows/fix-chat-context-continuity.yml
