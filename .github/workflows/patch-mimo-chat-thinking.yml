name: Patch MiMo chat compatibility

on:
  push:
    paths:
      - scripts/patch-mimo-chat-thinking.mjs
      - .github/workflows/patch-mimo-chat-thinking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: node scripts/patch-mimo-chat-thinking.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "sooya7"
          git config user.email "779083953@qq.com"
          git add packages/core/src/providers/builtin.ts packages/core/src/providers/mimo-thinking.contract.test.ts
          git commit -m "fix(chat): disable implicit MiMo thinking"
          git push
