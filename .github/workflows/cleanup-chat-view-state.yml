name: One-shot chat view-state cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-chat-view-state.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove dead cross-route anchor restore controller
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('packages/web/src/App.tsx')
          s = app_path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              s = s.replace(old, new, 1)

          replace_once("import { anchorScrollCorrection, captureChatViewState, INITIAL_CHAT_VIEW_STATE, type ChatScrollAnchor, type ChatViewState } from './lib/chatViewState.js';\n", "", 'chatViewState import')
          replace_once("export type ChatViewStateRef = { current: ChatViewState };\n", "", 'ChatViewStateRef type')
          replace_once("export default function ChatSessionHost({ active = true }: { active?: boolean }) {\n  const chat = useChat();\n  const viewStateRef = useRef<ChatViewState>({ ...INITIAL_CHAT_VIEW_STATE });\n  return active ? <ChatView chat={chat} viewStateRef={viewStateRef} /> : null;\n}\n", "export default function ChatSessionHost({ active = true }: { active?: boolean }) {\n  const chat = useChat();\n  return active ? <ChatView chat={chat} /> : null;\n}\n", 'ChatSessionHost view state')

          s, count = re.subn(r"\n/\*\* 锚点消息顶边相对滚动容器视口顶部的实测位置；未渲染或消息已不存在时返回 null。 \*/\nfunction anchorTopInViewport\(.*?\n}\n", "", s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'anchorTopInViewport: expected one match, got {count}')

          replace_once("export function ChatView({ chat, viewStateRef }: { chat: ChatController; viewStateRef: ChatViewStateRef }) {", "export function ChatView({ chat }: { chat: ChatController }) {", 'ChatView signature')
          replace_once("  const initialViewState = useRef(viewStateRef.current).current;\n", "", 'initialViewState')
          replace_once("const [stickToBottom, setStickToBottom] = useState(initialViewState.stickToBottom);", "const [stickToBottom, setStickToBottom] = useState(true);", 'stickToBottom state')
          replace_once("const stickToBottomRef = useRef(initialViewState.stickToBottom);", "const stickToBottomRef = useRef(true);", 'stickToBottom ref')

          s, count = re.subn(r"  // 锚定保持期：.*?  const releaseAnchorLock = \(\) => \{ anchorLockRef\.current = false; restoreInProgressRef\.current = false; \};\n", "", s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'anchor state block: expected one match, got {count}')

          replace_once("  const handleScroll = useCallback(() => { const el = scrollerRef.current; if (!el) return; const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight <= NEAR_BOTTOM_PX; stickToBottomRef.current = atBottom; setStickToBottom(atBottom); if (atBottom) { setUnread(0); releaseAnchorLock(); } }, []);", "  const handleScroll = useCallback(() => { const el = scrollerRef.current; if (!el) return; const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight <= NEAR_BOTTOM_PX; stickToBottomRef.current = atBottom; setStickToBottom(atBottom); if (atBottom) setUnread(0); }, []);", 'handleScroll anchor release')

          initial_replacement = """    if (!didInitialScrollRef.current && count > 0) {
              didInitialScrollRef.current = true; prevLastIdRef.current = lastId;
              virtualizer.scrollToIndex(count - 1, { align: 'end' });
              window.requestAnimationFrame(() => {
                if (scrollerRef.current) virtualizer.scrollToIndex(count - 1, { align: 'end' });
              });
              return;
            }
            const appended"""
          s, count = re.subn(r"    if \(!didInitialScrollRef\.current && count > 0\) \{.*?\n    \}\n    const appended", initial_replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'initial scroll branch: expected one match, got {count}')

          s, count = re.subn(r"\n  // 锚定修正：.*?\n  useLayoutEffect\(\(\) => \(\) => \{", "\n  useLayoutEffect(() => () => {", s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'anchor correction effect: expected one match, got {count}')

          s, count = re.subn(r"  useLayoutEffect\(\(\) => \(\) => \{\n    const scroller = scrollerRef\.current;.*?  \}, \[chat\.messages, viewStateRef, virtualizer\]\);\n", "", s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'capture view-state effect: expected one match, got {count}')

          replace_once(" onScroll={handleScroll} onWheel={releaseAnchorLock} onPointerDown={releaseAnchorLock} onTouchStart={releaseAnchorLock} data-testid=\"scroller\"", " onScroll={handleScroll} data-testid=\"scroller\"", 'scroller anchor gesture handlers')

          forbidden = ['viewStateRef', 'initialViewState', 'anchorLockRef', 'restoreInProgressRef', 'releaseAnchorLock', 'anchorScrollCorrection', 'captureChatViewState', 'ChatScrollAnchor', 'ChatViewState', 'chatViewState.js']
          leftovers = [token for token in forbidden if token in s]
          if leftovers:
              raise SystemExit(f'anchor controller leftovers in App.tsx: {leftovers}')

          app_path.write_text(s)
          PY

          git rm packages/web/src/App.anchorRestore.test.tsx
          git rm packages/web/src/App.viewState.test.tsx
          git rm packages/web/src/lib/chatViewState.ts
          git rm packages/web/src/lib/chatViewState.test.ts
          git rm .github/workflows/cleanup-chat-view-state.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name sooya7
          git config user.email 779083953@qq.com
          git add packages/web/src/App.tsx
          git diff --cached --check
          git commit -m "refactor(chat): remove dead anchor restore controller"
          git push origin HEAD:main
