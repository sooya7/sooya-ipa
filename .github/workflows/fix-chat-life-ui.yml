name: Fix chat life UI
on:
  push:
    paths:
      - .github/workflows/fix-chat-life-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/tmp/fix_chat_life.py
      - name: Commit source patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core packages/web
          git commit -m "fix: align chat runtime and life UI with saved state"
          git push origin HEAD:main
      - name: Remove one-shot files
        run: |
          git pull --rebase origin main
          git rm .github/workflows/fix-chat-life-ui.yml .github/tmp/fix_chat_life.py
          git commit -m "chore: remove one-shot chat life patch"
          git push origin HEAD:main
