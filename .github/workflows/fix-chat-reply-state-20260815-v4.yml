name: Fix chat reply state v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chat-reply-state-20260815-v4.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Apply verified reply-state fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-chat-reply-state-20260815-v2.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'v2-patch.py', 'exec'), {})

          use_chat = Path('packages/web/src/lib/useChat.ts')
          source = use_chat.read_text()
          old = "            const detail = String(data.error ?? failure?.message ?? '');"
          new = "            const detail = typeof data.error === 'string' ? data.error : failure?.message ?? '';"
          if source.count(old) != 1: raise SystemExit('detail patch mismatch')
          source = source.replace(old, new, 1)
          failed_start = source.index("          case 'reply.failed': {")
          failed_end = source.index("          case 'reply.text.delta': {", failed_start)
          block = source[failed_start:failed_end]
          old = "            if (message) applyMessages([message]);\n            else void resync();"
          new = "            if (message) applyMessages([message]);\n            else if (batchId) void resync();"
          if block.count(old) != 1: raise SystemExit('failed-handler resync patch mismatch')
          block = block.replace(old, new, 1)
          source = source[:failed_start] + block + source[failed_end:]
          use_chat.write_text(source)

          stream = Path('packages/web/src/lib/stream.ts')
          source = stream.read_text()
          source = source.replace("    'message.received',\n    'reply.thinking',", "    'message.received',\n    'reply.queued',\n    'reply.thinking',", 1)
          source = source.replace("    'reply.completed',\n    'reply.failed',\n    'reply.batch.collecting',", "    'reply.completed',\n    'reply.failed',\n    'reply.interrupted',\n    'reply.batch.collecting',", 1)
          if "'reply.queued'" not in source or "'reply.interrupted'" not in source: raise SystemExit('stream event allowlist patch failed')
          stream.write_text(source)
          BOOT
      - run: npm ci
      - name: Web tests
        run: npm run test -w @sooya/web
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-chat-reply-state-20260815.yml .github/workflows/fix-chat-reply-state-20260815-v2.yml .github/workflows/fix-chat-reply-state-20260815-v3.yml .github/workflows/fix-chat-reply-state-20260815-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/web/src/lib/useChat.ts packages/web/src/lib/useChat.test.tsx packages/web/src/lib/stream.ts packages/web/src/components/MessageItem.tsx packages/web/src/components/MessageItem.test.tsx packages/web/src/components/ChatHeader.tsx packages/web/src/components/ChatHeader.css packages/web/src/App.tsx
          git commit -m 'fix(chat): settle reply failures and stabilize mobile header'
          git push origin HEAD:main
